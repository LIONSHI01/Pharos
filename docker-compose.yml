version: "3"

services:
  node-app:
    container_name: pharos_bot
    build: .
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules # Preserve container's node_modules
    env_file:
      - .env
    environment:
      - NODE_ENV=development
    command: node index.js
    restart: always
